<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddock Workspace</title>
<style>
/* ============ TOKENS ============ */
:root{
  /* light — "engineering paper" */
  --bg:#EAECEF; --surface:#FFFFFF; --surface-2:#F4F6F8; --elevated:#FFFFFF;
  --border:#D6DCE1; --border-strong:#C0C9D0;
  --text:#13202B; --dim:#566572; --faint:#8695A1;
  --accent:#E8501F; --accent-ink:#FFFFFF; --accent-soft:#FBE7DE;
  --purple:#6E38C9; --green:#1C9A54; --yellow:#A9781F; --red:#CF3439;
  --purple-bg:#EFE7FB; --green-bg:#E2F3E9; --yellow-bg:#F6EEDD; --red-bg:#FAE4E5;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 8px 24px -12px rgba(20,32,42,.18);
  --f-disp:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1116; --surface:#131B21; --surface-2:#0F161B; --elevated:#1A242C;
  --border:#25313A; --border-strong:#33424C;
  --text:#E7EEF2; --dim:#93A4B0; --faint:#5E6F7B;
  --accent:#FF5E2B; --accent-ink:#170A04; --accent-soft:#3A1D10;
  --purple:#B482F2; --green:#38CB7B; --yellow:#E6B84E; --red:#F26065;
  --purple-bg:#241634; --green-bg:#0F2A1D; --yellow-bg:#2C2411; --red-bg:#30161A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0B1116; --surface:#131B21; --surface-2:#0F161B; --elevated:#1A242C;
  --border:#25313A; --border-strong:#33424C;
  --text:#E7EEF2; --dim:#93A4B0; --faint:#5E6F7B;
  --accent:#FF5E2B; --accent-ink:#170A04; --accent-soft:#3A1D10;
  --purple:#B482F2; --green:#38CB7B; --yellow:#E6B84E; --red:#F26065;
  --purple-bg:#241634; --green-bg:#0F2A1D; --yellow-bg:#2C2411; --red-bg:#30161A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--f-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:800; letter-spacing:-.02em; margin:0; text-wrap:balance}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
a{color:inherit}
::selection{background:var(--accent); color:var(--accent-ink)}

/* ============ SHELL ============ */
.app{display:grid; grid-template-columns:224px 1fr; grid-template-rows:auto 1fr; min-height:100vh}
.topbar{grid-column:1/3; display:flex; align-items:center; gap:16px; height:58px; padding:0 18px;
  background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-disp); font-weight:800; letter-spacing:-.01em}
.brand .flag{width:26px;height:26px;border-radius:7px;background:
  conic-gradient(from 45deg,#111 0 25%,#fff 0 50%,#111 0 75%,#fff 0);
  box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.brand small{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase; display:block; margin-top:-2px}
.ctx{display:flex; align-items:center; gap:10px; margin-left:6px; padding-left:16px; border-left:1px solid var(--border)}
.ctx .car-no{font-family:var(--f-disp); font-weight:800; font-size:19px; background:var(--text); color:var(--surface);
  padding:1px 8px; border-radius:6px; letter-spacing:-.03em}
.ctx-meta{line-height:1.15}
.ctx-meta b{font-size:13.5px} .ctx-meta span{display:block; font-size:11px; color:var(--dim)}
.spacer{flex:1}
.evt{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  padding:6px 11px;border-radius:9px;font-size:12.5px;cursor:pointer}
.evt .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.evt b{font-weight:700}
/* view-as toggle */
.viewas{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
.viewas button{font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--dim);
  padding:5px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.viewas button.on{background:var(--accent);color:var(--accent-ink)}
.viewas button.on.fan{background:var(--purple);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2b6cb0,#1a3a5c);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;font-family:var(--f-disp)}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);
  cursor:pointer;color:var(--dim);display:grid;place-items:center}

/* sidebar */
.side{background:var(--surface); border-right:1px solid var(--border); padding:14px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:58px; align-self:start; height:calc(100vh - 58px); overflow:auto}
.side .grp{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 10px 5px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--dim);font-weight:550;font-size:13.5px;border:1px solid transparent}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.active{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);font-weight:650}
.nav svg{width:17px;height:17px;flex:none}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;background:var(--surface-2);color:var(--dim);padding:1px 6px;border-radius:20px;border:1px solid var(--border)}
.nav.active .cnt{background:var(--surface);color:var(--accent)}
.side .lock{margin-top:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;font-size:11.5px;color:var(--dim)}
.side .lock b{color:var(--text);display:block;font-size:12px;margin-bottom:3px}

/* main */
.main{padding:22px 26px 60px;min-width:0}
.view{display:none;animation:fade .25s ease}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:26px}
.page-head p{margin:4px 0 0;color:var(--dim);font-size:13px}
.btn{font:inherit;font-weight:650;font-size:13px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:8px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn svg{width:15px;height:15px}

/* cards & grid */
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:13.5px;letter-spacing:-.01em}
.card-h .eyebrow{margin-bottom:0}

.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .eyebrow{margin-bottom:9px}
.kpi .big{font-family:var(--f-mono);font-weight:700;font-size:27px;letter-spacing:-.02em;line-height:1}
.kpi .sub{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:5px}
.trend{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px}
.trend.up{color:var(--green);background:var(--green-bg)}
.trend.dn{color:var(--red);background:var(--red-bg)}

/* pills / chips */
.pill{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;text-transform:uppercase}
.pill.pub{color:var(--green);background:var(--green-bg)} .pill.team{color:var(--purple);background:var(--purple-bg)}
.pill.warn{color:var(--yellow);background:var(--yellow-bg)} .pill.crit{color:var(--red);background:var(--red-bg)}
.pill.ok{color:var(--green);background:var(--green-bg)} .pill.neutral{color:var(--dim);background:var(--surface-2);border:1px solid var(--border)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.fastest{color:var(--purple);font-weight:700}
.pb{color:var(--green);font-weight:600}

/* track list */
.tracks{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.trackcard{cursor:pointer;overflow:hidden}
.trackcard:hover{border-color:var(--faint);transform:translateY(-2px);transition:.15s}
.trackcard .top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 8px}
.trackcard .layout{height:64px;margin:2px 14px 10px;opacity:.8}
.trackcard .layout svg{height:100%;width:100%}
.trackcard .foot{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim)}
.trackcard h4{font-size:14px} .trackcard .loc{font-size:11px;color:var(--dim)}

/* setup sheet */
.setup-grid{grid-template-columns:1fr 1fr;gap:14px}
.spec{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.spec:last-child{border-bottom:0}
.spec .k{color:var(--dim)} .spec .v{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.spec .v .u{color:var(--faint);font-weight:400;font-size:11px;margin-left:2px}
.corner{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbox{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;text-align:center}
.cbox .lbl{font-family:var(--f-mono);font-size:9.5px;color:var(--faint);letter-spacing:.1em}
.cbox .val{font-family:var(--f-mono);font-weight:700;font-size:16px;margin-top:2px}
.cbox .val small{font-size:10px;color:var(--dim);font-weight:400}

/* guard (public/private) */
.guard{position:relative}
.guard__lock{display:none}
body.fan .guard[data-guard] .guard__body{filter:blur(7px) saturate(.6);pointer-events:none;user-select:none}
body.fan .guard[data-guard] .guard__lock{display:flex;position:absolute;inset:0;z-index:5;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;
  background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:14px}
.guard__lock .ic{width:34px;height:34px;border-radius:10px;background:var(--purple-bg);color:var(--purple);display:grid;place-items:center}
.guard__lock b{font-family:var(--f-disp);font-size:14px}
.guard__lock span{font-size:11.5px;color:var(--dim);max-width:230px}
.fan-only{display:none} body.fan .fan-only{display:block}
.fan-banner{display:none}
body.fan .fan-banner{display:flex;align-items:center;gap:12px;background:var(--purple-bg);
  border:1px solid color-mix(in srgb,var(--purple) 30%,transparent);border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:12.5px}
.fan-banner .ic{width:28px;height:28px;border-radius:8px;background:var(--purple);color:#fff;display:grid;place-items:center;flex:none}
.fan-banner b{color:var(--purple)}

/* chart */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);padding:2px 2px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* checklist */
.check{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:0}
.check .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border-strong);flex:none;display:grid;place-items:center;color:transparent}
.check.done .box{background:var(--green);border-color:var(--green);color:#fff}
.check.done .txt{color:var(--faint);text-decoration:line-through}
.check .who{margin-left:auto;font-size:11px;color:var(--faint);font-family:var(--f-mono)}

/* life bar */
.lifebar{width:74px;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle;border:1px solid var(--border)}
.lifebar i{display:block;height:100%}

.progress{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.progress i{display:block;height:100%;background:var(--accent)}

.two{grid-template-columns:1.6fr 1fr}
.hint{font-size:11.5px;color:var(--faint)}
.divider{height:1px;background:var(--border);margin:14px 0}
.avatars{display:flex}
.avatars .a{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px;background:#3a4a58;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.avatars .a:first-child{margin-left:0}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{gap:10px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .setup-grid,.two{grid-template-columns:1fr}
  .ctx-meta,.brand small{display:none}
}
</style><style>
/* additions for the real application: empty states, forms, toasts */
.empty{padding:28px 18px;text-align:center;color:var(--dim);font-size:13.5px}
.empty b{display:block;color:var(--text);font-family:var(--f-disp);font-size:15px;margin-bottom:5px}
.empty .btn{margin-top:12px}
.skel{color:var(--faint);font-size:12.5px;padding:16px 18px}
.pk-ov{position:fixed;inset:0;background:rgba(4,8,11,.72);z-index:200;display:grid;place-items:center;padding:20px}
.pk-md{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(460px,100%);overflow:hidden}
.pk-md h3{font-size:15px;padding:15px 18px;border-bottom:1px solid var(--border);margin:0}
.pk-bd{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.pk-bd label{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}
.pk-bd input,.pk-bd select,.pk-bd textarea{width:100%;font:inherit;font-size:14px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px}
.pk-ft{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--border)}
.pk-err{color:var(--red);font-size:12.5px;min-height:1em}
.pk-act{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);padding:5px 11px;border-radius:8px;cursor:pointer;margin-left:6px}
.pk-act.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pk-act.pub{background:var(--green-bg);color:var(--green);border-color:transparent}
.pk-act.prv{background:var(--purple-bg);color:var(--purple);border-color:transparent}
.pk-sel{font:inherit;font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:5px 8px;margin-left:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:11px 16px;box-shadow:var(--shadow);z-index:300;font-size:13px}
.toast.err{border-color:var(--red);color:var(--red)}
.check{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="flag"></div><div>Paddock<small>by HYPERPLM</small></div></div>
    <div class="ctx" id="ctx"></div>
    <div class="spacer"></div>
    <div class="evt" id="evt" style="display:none"></div>
    <button class="theme-btn" onclick="toggleTheme()" title="Theme" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <a class="btn" href="/app" style="padding:6px 12px;font-size:12.5px">PLM</a>
    <a class="btn" href="/paddock" style="padding:6px 12px;font-size:12.5px">Fan Zone</a>
    <div class="avatar" id="who">·</div>
  </header>

  <aside class="side">
    <div class="grp">Workspace</div>
    <div class="nav active" data-nav="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</div>
    <div class="nav" data-nav="tracks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15c0-5 4-9 8-9s6 2 6 5-2 4-4 4-3-1-3-2 1-2 2-2"/><circle cx="4" cy="15" r="2"/></svg>Track Data<span class="cnt" id="c-tracks">–</span></div>
    <div class="nav" data-nav="setups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Setup Sheets<span class="cnt" id="c-setups">–</span></div>
    <div class="nav" data-nav="times"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5m0 14h16M4 19l5-6 4 3 6-8"/></svg>Lap Times<span class="cnt" id="c-laps">–</span></div>
    <div class="nav" data-nav="checklists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Checklists<span class="cnt" id="c-checks">–</span></div>
    <div class="grp">Garage</div>
    <div class="nav" data-nav="parts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Parts &amp; CAD<span class="cnt" id="c-parts">–</span></div>
    <div class="nav" data-nav="car"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-5a3 3 0 0 1 3-2h8a3 3 0 0 1 3 2l2 5v4H3v-4Z"/><circle cx="7.5" cy="17" r="1.6"/><circle cx="16.5" cy="17" r="1.6"/></svg>Car &amp; Build</div>
    <div class="lock"><b>🔒 Visibility</b>Data marked <span class="pill team" style="font-size:9px">Team</span> stays in the garage. <span class="pill pub" style="font-size:9px">Public</span> feeds the Fan Zone.</div>
  </aside>

  <main class="main">
    <section class="view show" id="v-overview"></section>
    <section class="view" id="v-tracks"></section>
    <section class="view" id="v-setups"></section>
    <section class="view" id="v-times"></section>
    <section class="view" id="v-checklists"></section>
    <section class="view" id="v-parts"></section>
    <section class="view" id="v-car"></section>
  </main>
</div>
<script>
/* ══ Paddock workspace — a real application ═════════════════════════════════
   Every number, row and chart on this page is rendered from the API. There is
   no placeholder content: if a panel is empty it says so and offers the action
   that fills it. State lives in ST; render() redraws the active view. */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>ms==null?"—":`${Math.floor(ms/60000)}:${((ms%60000)/1000).toFixed(3).padStart(6,"0")}`;
const toMs=s=>{const m=String(s).trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m?Math.round((+(m[1]||0))*60000+parseFloat(m[2])*1000):null;};
const dt=s=>s?new Date(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"—";

async function api(p,method="GET",body){
  const o={method,credentials:"same-origin",headers:{}};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  const r=await fetch(p,o);
  if(r.status===401){location.href="/login";throw new Error("auth");}
  if(!r.ok){let d="";try{d=(await r.json()).detail||""}catch(e){}throw new Error(d||`HTTP ${r.status}`);}
  return r.status===204?null:r.json();
}
function toast(msg,bad){const t=document.createElement("div");t.className="toast"+(bad?" err":"");
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function toggleTheme(){const r=document.documentElement;let c=r.getAttribute("data-theme");
  if(!c)c=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  r.setAttribute("data-theme",c==="dark"?"light":"dark");}

/* ── modal ─────────────────────────────────────────────────────────────── */
function modal(title,fields,onSubmit,okLabel){
  const ov=document.createElement("div");ov.className="pk-ov";
  ov.innerHTML=`<div class="pk-md"><h3>${esc(title)}</h3><div class="pk-bd">
    ${fields.map(f=>`<div><label>${esc(f.label)}</label>${
      f.type==="select"?`<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`
      :f.type==="textarea"?`<textarea name="${f.name}" rows="3">${esc(f.value||"")}</textarea>`
      :`<input name="${f.name}" placeholder="${esc(f.ph||"")}" value="${esc(f.value??"")}" ${f.type==="date"?'type="date"':""}>`}</div>`).join("")}
    <div class="pk-err"></div></div>
    <div class="pk-ft"><button class="btn" data-x>Cancel</button>
    <button class="btn primary" data-ok>${esc(okLabel||"Save")}</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("[data-x]").onclick=close; ov.onclick=e=>{if(e.target===ov)close();};
  ov.querySelector("[data-ok]").onclick=async()=>{
    const v={};$$("input,select,textarea",ov).forEach(i=>v[i.name]=i.value);
    const b=ov.querySelector("[data-ok]");b.disabled=true;b.textContent="Saving…";
    try{ await onSubmit(v); close(); await refresh(); }
    catch(e){ ov.querySelector(".pk-err").textContent=e.message; b.disabled=false; b.textContent=okLabel||"Save"; }
  };
  ov.querySelector("input,select,textarea")?.focus();
  return ov;
}
function confirmModal(title,msg,onYes,okLabel){
  const ov=document.createElement("div");ov.className="pk-ov";
  ov.innerHTML=`<div class="pk-md"><h3>${esc(title)}</h3>
    <div class="pk-bd"><div style="color:var(--dim);font-size:13.5px;line-height:1.55">${esc(msg)}</div>
    <div class="pk-err"></div></div>
    <div class="pk-ft"><button class="btn" data-x>Cancel</button>
    <button class="btn primary" data-ok>${esc(okLabel||"Confirm")}</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("[data-x]").onclick=()=>ov.remove(); ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.querySelector("[data-ok]").onclick=async()=>{
    try{ await onYes(); ov.remove(); await refresh(); }
    catch(e){ ov.querySelector(".pk-err").textContent=e.message; }
  };
}
function notice(title,msg){confirmModal(title,msg,async()=>{},"OK");}

/* ── state ─────────────────────────────────────────────────────────────── */
const ST={me:null,teams:[],team:null,tracks:[],sessions:[],laps:[],setups:[],
          checklists:[],parts:[],published:new Set(),view:"overview"};

async function loadAll(){
  const [me,teams,tracks,pub]=await Promise.all([
    api("/auth/me").catch(()=>null), api("/api/racing/teams"),
    api("/api/racing/tracks"), fetch("/api/public/teams").then(r=>r.json()).catch(()=>[])]);
  ST.me=me; ST.teams=teams; ST.tracks=tracks;
  ST.published=new Set(pub.map(p=>String(p.car_number)));
  const saved=+localStorage.getItem("pk_team")||0;
  ST.team=teams.find(t=>t.id===saved)||null;
  if(!ST.team && teams.length){
    // default to the team that has actually run, not whichever sorts first
    let best=teams[0],bn=-1;
    for(const t of teams){
      const n=await api(`/api/racing/teams/${t.id}/sessions`).then(x=>x.length).catch(()=>0);
      if(n>bn){bn=n;best=t;}
    }
    ST.team=best;
  }
  if(ST.team){
    const [s,l,su,cl,pa]=await Promise.all([
      api(`/api/racing/teams/${ST.team.id}/sessions`).catch(()=>[]),
      api(`/api/racing/teams/${ST.team.id}/laps`).catch(()=>[]),
      api(`/api/racing/setups?team_id=${ST.team.id}`).catch(()=>[]),
      api(`/api/racing/checklists?team_id=${ST.team.id}`).catch(()=>[]),
      api(`/api/racing/parts?team_id=${ST.team.id}`).catch(()=>[])]);
    ST.sessions=s; ST.laps=l; ST.setups=su; ST.checklists=cl; ST.parts=pa;
  } else { ST.sessions=[];ST.laps=[];ST.setups=[];ST.checklists=[];ST.parts=[]; }
}
async function refresh(){ await loadAll(); render(); }

/* ── chrome ────────────────────────────────────────────────────────────── */
function renderChrome(){
  const t=ST.team;
  $("#who").textContent=(ST.me?.username||"?").slice(0,2).toUpperCase();
  $("#c-tracks").textContent=ST.tracks.length;
  $("#c-setups").textContent=ST.setups.length;
  $("#c-laps").textContent=ST.laps.length;
  $("#c-checks").textContent=ST.checklists.length;
  $("#c-parts").textContent=ST.parts.length;

  const ctx=$("#ctx");
  if(!t){ ctx.innerHTML=`<div class="ctx-meta"><b>No team yet</b><span>create one to begin</span></div>`; }
  else{
    const isPub=ST.published.has(String(t.car_number));
    ctx.innerHTML=`<div class="car-no">${esc(t.car_number||"—")}</div>
      <div class="ctx-meta"><b>${esc(t.name)}</b>
      <span>${esc([t.class,t.series].filter(Boolean).join(" · ")||"—")}</span></div>`;
    if(ST.teams.length>1){
      const sel=document.createElement("select");sel.className="pk-sel";
      sel.innerHTML=ST.teams.map(x=>`<option value="${x.id}" ${x.id===t.id?"selected":""}>#${esc(x.car_number)} ${esc(x.name)}</option>`).join("");
      sel.onchange=async()=>{localStorage.setItem("pk_team",sel.value);await refresh();};
      ctx.appendChild(sel);
    }
    const b=document.createElement("button");
    b.className="pk-act "+(isPub?"pub":"prv");
    b.textContent=isPub?"● Public":"○ Private";
    b.title=isPub?"Visible in the Fan Zone":"Not visible to fans";
    b.onclick=()=>confirmModal(isPub?"Unpublish this team?":"Publish this team?",
      isPub?"Fans will no longer see this team or its published sessions."
           :"Fans will see this team and any sessions you have published. Setups stay private.",
      async()=>{await api(`/api/racing/teams/${t.id}/public`,"PATCH",{is_public:!isPub});
                toast(isPub?"Unpublished":"Published to fans");},
      isPub?"Unpublish":"Publish");
    ctx.appendChild(b);
  }
  // the event strip reflects the most recent real session
  const last=ST.sessions[ST.sessions.length-1];
  const evt=$("#evt");
  if(last){ evt.style.display="";
    evt.innerHTML=`<span class="dot"></span><div style="line-height:1.1">
      <b>${esc(last.event)}</b><div style="font-size:10.5px;color:var(--dim)">${esc(last.track)} · ${dt(last.session_date)}</div></div>`;
  } else evt.style.display="none";
}

const empty=(title,msg,btn="")=>`<div class="card"><div class="empty"><b>${esc(title)}</b>${esc(msg)}${btn}</div></div>`;
const visPill=v=>`<span class="pill ${v==="public"?"pub":"team"}">${esc(v)}</span>`;

      <div class="card"><div class="card-h"><h3>Checklist</h3>
        <a class="hint" style="color:var(--accent);cursor:pointer" onclick="go('checklists')">All</a></div>
        ${ST.checklists.length?`<div style="padding:6px 16px 12px">${ST.checklists[0].items.map(i=>
          `<div class="check ${i.is_done?"done":""}" onclick="tick(${i.id},${!i.is_done})">
            <div class="box">${i.is_done?"✓":""}</div><div class="txt">${esc(i.label)}</div>
            <div class="who">${esc(i.assigned_role||"—")}</div></div>`).join("")}</div>`
        :'<div class="empty">No checklist yet.<div><button class="btn" style="margin-top:10px" onclick="newChecklist()">Create one</button></div></div>'}</div></div>`
    + `<div class="grid two" style="margin-top:14px">
      <div class="card"><div class="card-h"><h3>Recent laps</h3>
        <a class="hint" style="color:var(--accent);cursor:pointer" onclick="go('times')">All</a></div>
        ${ST.laps.length?`<div class="tablewrap"><table>
          <thead><tr><th>Session</th><th>Track</th><th>Driver</th><th class="num">Time</th><th>Visibility</th></tr></thead>
          <tbody>${ST.laps.slice(0,5).map(l=>`<tr><td class="mono" style="text-transform:uppercase">${esc(l.session_type)}</td>

function viewTracks(){
  return head("Circuit library",`Track Data`,
    `${ST.tracks.length} circuits available to every team.`,
    `<button class="btn" onclick="filterTracks('')">All</button>
     <button class="btn" onclick="filterTracks('IMSA')">IMSA</button>
     <button class="btn" onclick="filterTracks('IndyCar')">IndyCar</button>`)
    + `<div class="grid tracks" id="trackGrid">${trackCards(ST._tf||"")}</div>`;
}
function trackCards(f){
  const list=ST.tracks.filter(t=>!f||(t.series_tag||"").includes(f));
  if(!list.length) return empty("No circuits","Nothing matches that filter.");
  return list.map(t=>{
    const runs=ST.sessions.filter(s=>s.track===t.name).length;
    return `<div class="card trackcard">
      <div class="top"><div><h4>${esc(t.name)}</h4><div class="loc">${esc(t.location||"")}</div></div>
        <span class="pill neutral">${esc(t.layout)}</span></div>
      <div class="foot"><span>${t.turns??"—"} turns · ${t.length_km?t.length_km.toFixed(3)+" km":"—"}</span>
        <span class="mono" style="color:${runs?"var(--accent)":"var(--faint)"}">${runs?runs+" session"+(runs===1?"":"s"):"not run"}</span></div></div>`;
  }).join("");
}
function filterTracks(f){ST._tf=f;const g=$("#trackGrid");if(g)g.innerHTML=trackCards(f);}

      ${cars.length?`<div class="pad">${cars.map(c=>`<div class="spec"><span class="k">${esc(c.chassis)}</span>
        <span class="v" style="font-weight:400">${esc(c.model||"—")}</span></div>`).join("")}</div>`
      :'<div class="empty">No car recorded.<div><button class="btn" style="margin-top:10px" onclick="addCar()">Add a car</button></div></div>'}</div>
    <div class="card"><div class="card-h"><h3>Drivers</h3></div>
      ${drv.length?`<div class="pad">${drv.map(d=>`<div class="spec"><span class="k">${esc(d.name)}</span>
        <span class="v" style="font-weight:400">${esc(d.country||"—")}</span></div>`).join("")}</div>`
      :'<div class="empty">No drivers.<div><button class="btn" style="margin-top:10px" onclick="addDriver()">Add a driver</button></div></div>'}</div></div>`;
}

/* ── chart (inline SVG, drawn from real laps) ───────────────────────────── */
function drawChart(el,laps){
  if(!el||!laps.length) return;
  const pts=[...laps].sort((a,b)=>(a.session_date||"").localeCompare(b.session_date||""));
  const W=640,H=200,pl=52,pr=14,pt=16,pb=28;
  const ys=pts.map(p=>p.lap_time_ms/1000);
  const lo=Math.min(...ys)-0.4, hi=Math.max(...ys)+0.4;
  const X=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  let grid="";
  for(let r=0;r<=4;r++){const y=pt+(H-pt-pb)*r/4, v=hi-(hi-lo)*r/4;
    grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--border)"/>
      <text x="${pl-8}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--faint)" font-family="var(--f-mono)">${fmt(v*1000)}</text>`;}
  let line="",area="";
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.lap_time_ms/1000);line+=(i?"L":"M")+x+","+y+" ";area+=(i?"L":"M")+x+","+y+" ";});
  area+=`L${X(pts.length-1)},${H-pb} L${X(0)},${H-pb} Z`;
  const dots=pts.map((p,i)=>{const x=X(i),y=Y(p.lap_time_ms/1000);
    const c=p.is_fastest?"var(--purple)":(p.is_pb?"var(--green)":"var(--accent)");
    return `<circle cx="${x}" cy="${y}" r="${p.is_fastest?4.5:3}" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`+
      (p.is_fastest?`<text x="${x}" y="${y-10}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--purple)" font-family="var(--f-mono)">${fmt(p.lap_time_ms)}</text>`:"");}).join("");
  const xl=pts.map((p,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--faint)" font-family="var(--f-mono)">${esc(p.session_type.toUpperCase())}</text>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g1)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xl}</svg>`;
}

/* ── actions ───────────────────────────────────────────────────────────── */
function newTeam(){
  modal("Create a team",[
    {label:"Team name",name:"name",ph:"Meridian Autosport"},
    {label:"Car number",name:"car_number",ph:"74"},
    {label:"Series",name:"series",ph:"IMSA WeatherTech"},
    {label:"Class",name:"class",ph:"GTD"},
  ],async v=>{
    if(!v.name.trim()) throw new Error("A team needs a name");
    const key=(v.name+"-"+v.car_number).toUpperCase().replace(/[^A-Z0-9]+/g,"-").slice(0,60);
    const t=await api("/api/racing/teams","POST",{team_key:key,name:v.name,
      car_number:v.car_number,series:v.series,class:v.class});
    localStorage.setItem("pk_team",t.id); toast("Team created");
  },"Create");
}
function addCar(){
  modal("Add a car",[{label:"Chassis",name:"chassis",ph:"MB-GT3-2024-074"},
    {label:"Model",name:"model",ph:"Mercedes-AMG GT3"},
    {label:"Homologation",name:"homologation",ph:"FIA GT3-2024-14"}],
    async v=>{await api("/api/racing/cars","POST",{team_id:ST.team.id,...v});toast("Car added");});
}
function addDriver(){
  modal("Add a driver",[{label:"Name",name:"name",ph:"Dan Reyes"},
    {label:"Country",name:"country",ph:"USA"}],
    async v=>{await api("/api/racing/drivers","POST",{team_id:ST.team.id,...v});toast("Driver added");});
}
function newSession(){
  if(!ST.tracks.length) return notice("No circuits","The track library is empty.");
  const evs=[...new Map(ST.sessions.map(s=>[s.event,s])).values()];
  modal("New session",[
    {label:"Event",name:"event",type:"select",
     options:[...evs.map(e=>[String(e.event_id),e.event]),["__new","+ New event…"]]},
    {label:"New event name",name:"newname",ph:"Six Hours of The Glen"},
    {label:"Track (new events only)",name:"track_id",type:"select",options:ST.tracks.map(t=>[t.id,t.name])},
    {label:"Session type",name:"session_type",type:"select",
     options:[["fp1","FP1"],["fp2","FP2"],["fp3","FP3"],["qual","Qualifying"],["warmup","Warmup"],["race","Race"],["test","Test"]]},
    {label:"Visibility",name:"visibility",type:"select",options:[["public","Public — fans can see it"],["team","Team only"]]},
  ],async v=>{
    let eid;
    if(v.event==="__new"){
      if(!v.newname.trim()) throw new Error("Name the event");
      eid=(await api("/api/racing/events","POST",{team_id:ST.team.id,track_id:+v.track_id,name:v.newname})).id;
    } else eid=+v.event;
    await api("/api/racing/sessions","POST",{event_id:eid,session_type:v.session_type,
      visibility:v.visibility,session_date:new Date().toISOString()});
    toast("Session created");
  },"Create");
}
function logLap(){
  if(!ST.sessions.length) return notice("No sessions yet",
    "Create a session first — laps are logged against one.");
  modal("Log a lap",[
    {label:"Session",name:"run_session_id",type:"select",
     options:ST.sessions.map(s=>[s.id,`${s.session_type.toUpperCase()} · ${s.track}`])},
    {label:"Lap number",name:"lap_no",ph:"12"},
    {label:"Lap time",name:"t",ph:"1:41.208"},
    {label:"Tire",name:"tire_compound",ph:"Med"},
  ],async v=>{
    const ms=toMs(v.t); if(!ms) throw new Error("Time must look like 1:41.208");
    await api("/api/racing/laps","POST",{run_session_id:+v.run_session_id,
      lap_no:+v.lap_no||1,lap_time_ms:ms,tire_compound:v.tire_compound||""});
    toast("Lap logged");
  },"Log");
}
async function pubSession(id,cur){
  const on=cur==="public";
  confirmModal(on?"Unpublish session?":"Publish session?",
    on?"Its lap times will be withdrawn from the Fan Zone."
      :"Its lap times become visible to fans. Setups are unaffected.",
    async()=>{await api(`/api/racing/sessions/${id}/visibility`,"PATCH",{visibility:on?"team":"public"});
             toast(on?"Withdrawn":"Published");},on?"Unpublish":"Publish");
}
function newSetup(){
  if(!ST.tracks.length) return notice("No circuits","The track library is empty.");
  modal("New setup sheet",[
    {label:"Key",name:"setup_key",ph:"WG-2025-Q"},
    {label:"Track",name:"track_id",type:"select",options:ST.tracks.map(t=>[t.id,t.name])},
    {label:"Baseline",name:"baseline",ph:"WG-A"},
    {label:"Revision",name:"revision_label",value:"A"},
    {label:"Notes",name:"notes",type:"textarea"},
  ],async v=>{
    if(!v.setup_key.trim()) throw new Error("A sheet needs a key");
    await api("/api/racing/setups","POST",{setup_key:v.setup_key,team_id:ST.team.id,
      track_id:+v.track_id,baseline:v.baseline,revision_label:v.revision_label||"A",notes:v.notes});
    ST._setupKey=v.setup_key; toast("Sheet created");
  },"Create");
}
async function openSetup(key){
  try{ ST._setup=await api("/api/racing/setups/"+encodeURIComponent(key));
       const p=$("#setupPane"); if(p) p.innerHTML=setupPane(ST._setup); }
  catch(e){ toast(e.message,true); }
}
function addValue(setupId){
  modal("Add a setup value",[
    {label:"Group",name:"group_name",ph:"Corner weights"},
    {label:"Name",name:"attr_key",ph:"LF"},
    {label:"Value",name:"attr_value",ph:"312"},
    {label:"Unit",name:"unit",ph:"kg"},
  ],async v=>{
    if(!v.attr_key.trim()) throw new Error("Name the value");
    await api(`/api/racing/setups/${setupId}/values`,"PUT",v);
    toast("Value saved");
  },"Add");
}
function cloneSetup(key){
  modal("Clone as a new revision",[{label:"New key",name:"k",ph:key+"-B"}],
    async v=>{ if(!v.k.trim()) throw new Error("Name the new sheet");
      await api(`/api/racing/setups/${encodeURIComponent(key)}/clone?new_key=${encodeURIComponent(v.k)}`,"POST");
      ST._setupKey=v.k; toast("Revision created"); },"Clone");
}
async function pubSetup(id,cur){
  const on=cur==="public";
  confirmModal(on?"Unpublish this sheet?":"Publish this setup sheet?",
    on?"It returns to team-only."
      :"Corner weights, dampers, alignment and aero become visible to fans. This is your IP.",
    async()=>{await api(`/api/racing/setups/${id}/visibility`,"PATCH",{visibility:on?"team":"public"});
             toast(on?"Back to team-only":"Published");},on?"Unpublish":"Publish");
}
function newChecklist(){
  modal("New checklist",[
    {label:"Name",name:"name",ph:"Pre-qualifying"},
    {label:"Items (one per line)",name:"items",type:"textarea"},
  ],async v=>{
    if(!v.name.trim()) throw new Error("Name the checklist");
    const items=(v.items||"").split("\n").map(s=>s.trim()).filter(Boolean);
    await api("/api/racing/checklists","POST",{team_id:ST.team.id,name:v.name,items});
    toast("Checklist created");
  },"Create");
}
async function tick(id,done){
  try{ await api(`/api/racing/checklist-items/${id}?done=${done}`,"PATCH"); await refresh(); }
  catch(e){ toast(e.message,true); }
}
async function trackPart(){
  let parts=[];
  try{ parts=(await api("/api/parts?per_page=200")).items||[]; }catch(e){}
  if(!parts.length) return notice("No PLM parts",
    "Create a part in the PLM app first, then track it against this car.");
  modal("Track a part",[
    {label:"Part",name:"part_id",type:"select",options:parts.map(p=>[p.id,`${p.part_number} — ${p.part_name}`])},
    {label:"Hours used",name:"hours_used",value:"0"},
    {label:"Hours limit",name:"hours_limit",ph:"40"},
  ],async v=>{
    await api("/api/racing/parts","POST",{part_id:+v.part_id,team_id:ST.team.id,
      hours_used:parseFloat(v.hours_used)||0,
      hours_limit:v.hours_limit?parseFloat(v.hours_limit):null});
    toast("Part tracked");
  },"Track");
}
function logHours(id,num,cur){
  modal(`Log hours — ${num}`,[{label:"Hours used",name:"h",value:String(cur)}],
    async v=>{await api(`/api/racing/parts/${id}/hours`,"PATCH",{hours_used:parseFloat(v.h)||0});
             toast("Hours updated — status re-derived");},"Save");
}

/* ── render ────────────────────────────────────────────────────────────── */
const VIEWS={overview:viewOverview,tracks:viewTracks,setups:viewSetups,
             times:viewTimes,checklists:viewChecklists,parts:viewParts,car:viewCar};
function render(){
  renderChrome();
  const el=$("#v-"+ST.view);
  if(el) el.innerHTML=VIEWS[ST.view]();
  $$(".view").forEach(v=>v.classList.toggle("show",v.id==="v-"+ST.view));
  $$(".nav").forEach(n=>n.classList.toggle("active",n.dataset.nav===ST.view));
  if(ST.view==="overview") drawChart($("#chart"),ST.laps);
  if(ST.view==="times") drawChart($("#chart2"),ST.laps);
  if(ST.view==="setups"&&ST._setupKey){const k=ST._setupKey;ST._setupKey=null;openSetup(k);}
}
function go(v){ ST.view=v; render(); window.scrollTo({top:0}); }
$$(".nav").forEach(n=>n.onclick=()=>go(n.dataset.nav));

(async function(){
  try{ await loadAll(); render(); }
  catch(e){
    if(e.message==="auth") return;
    // A fan account has no organization, so the team workspace legitimately
    // refuses it. Say that plainly instead of showing a raw API error.
    const noOrg=/no organization/i.test(e.message);
    $("#v-overview").innerHTML=`<div class="card"><div class="empty">
      <b>${noOrg?"This is the team workspace":"Could not load"}</b>
      ${noOrg?"You are signed in as a fan, which belongs to no team. The Fan Zone is where you follow teams and see published lap times."
             :esc(e.message)}
      <div>${noOrg?`<a class="btn primary" href="/paddock">Go to the Fan Zone</a>
        <a class="btn" href="/login" style="margin-left:8px">Sign in as a team member</a>`
        :`<button class="btn" onclick="location.reload()">Try again</button>`}</div></div></div>`;
    $$(".view").forEach(v=>v.classList.toggle("show",v.id==="v-overview"));
  }
})();
</script>
